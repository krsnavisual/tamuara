# Reproducible local Supabase stack for Tamuara. This file contains no secrets.
# Run from the repository root: npx supabase start
project_id = "tamuara"

[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["http://localhost:3001"]

[auth.email]
enable_signup = true
enable_confirmations = true

[db.seed]
enabled = false
